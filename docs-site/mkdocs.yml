
site_name: PlaSiC C Tutorial
site_description: Documentation and tutorial for the PlaSiC climate model, an independent C11 implementation of PlaSim.
site_url: https://sunmoumou1.github.io/PlaSiC/

repo_url: https://github.com/sunmoumou1/PlaSiC
repo_name: PlaSiC


# =============================================================================
# 主题
# =============================================================================

theme:
  name: material
  font: false

  # ---------------------------------------------------------------------------
  # 站点 Logo
  # ---------------------------------------------------------------------------
  # Logo 显示在每个页面左上角的 Header 中，点击后回到教程首页。
  logo: tutorial/assets/images/logo.png

  # 浏览器标签页图标与 Logo 保持一致。
  favicon: tutorial/assets/images/logo.png

  language: en

  # ---------------------------------------------------------------------------
  # 导航功能
  # ---------------------------------------------------------------------------
  features:

    # GitBook 风格通常使用左侧文档树，因此不再使用 navigation.tabs。
    # 一级章节也统一放到左侧。
    - navigation.sections

    # 只展开当前章节，避免长目录挤占导航。

    # 支持章节 index 页面。
    - navigation.indexes

    # 页面滚动时让右侧 TOC 跟随。
    - toc.follow

    # 页面顶部返回按钮。
    - navigation.footer
    - navigation.top

    # 代码复制按钮。
    - content.code.copy

    # 支持代码注释。
    - content.code.annotate

    # 搜索建议。
    - search.suggest

    # 搜索结果高亮。
    - search.highlight


  # ---------------------------------------------------------------------------
  # 浅色 / 深色模式
  # ---------------------------------------------------------------------------
  palette:

    # 浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo

      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    # 深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo

      toggle:
        icon: material/weather-sunny
        name: Switch to light mode


# =============================================================================
# Markdown 扩展
# =============================================================================

markdown_extensions:

  # Markdown 表格
  - tables

  # 提示框
  - admonition

  # 属性列表
  # 后面如果需要自定义图片大小、按钮等会很方便。
  - attr_list

  # Markdown 内嵌 HTML
  - md_in_html

  # 数学公式
  - pymdownx.arithmatex:
      generic: true

  # 代码语法高亮
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span

  # 增强代码块
  - pymdownx.superfences

  # 折叠内容
  - pymdownx.details

  # Tab 页面
  - pymdownx.tabbed:
      alternate_style: true

  # 页面目录
  - toc:
      permalink: true


# =============================================================================
# JavaScript
# =============================================================================

extra_javascript:

  # MathJax 配置
  - tutorial/javascripts/mathjax.js

  # MathJax 3
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js


# =============================================================================
# 自定义 CSS
# =============================================================================

extra_css:
  - tutorial/stylesheets/extra.css


# =============================================================================
# 导航
# =============================================================================

hooks:
  - hooks/redirects.py
  - hooks/figure_labels.py

